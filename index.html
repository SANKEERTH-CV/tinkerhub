<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Students | Study Hub</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #65708a;
            --paper: #fffdf8;
            --coral: #ef705d;
            --yellow: #f8c85d;
            --blue: #6d9ee8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            background: #f4efe4;
            overflow-x: hidden;
        }

        .page {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 32px 20px;
            isolation: isolate;
        }

        .page::before,
        .page::after {
            position: absolute;
            z-index: -1;
            content: "";
            border-radius: 50%;
            filter: blur(1px);
            animation: float 7s ease-in-out infinite;
        }

        .page::before {
            width: 230px;
            height: 230px;
            top: 8%;
            left: -70px;
            background: var(--yellow);
            opacity: .7;
        }

        .page::after {
            width: 300px;
            height: 300px;
            right: -90px;
            bottom: 4%;
            background: var(--blue);
            opacity: .5;
            animation-delay: -2s;
        }

        .content {
            width: min(100%, 940px);
            padding: clamp(28px, 6vw, 68px);
            border: 2px solid var(--ink);
            border-radius: 28px;
            background: var(--paper);
            box-shadow: 12px 12px 0 var(--ink);
            animation: appear .8s ease both;
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 20px;
            padding: 8px 14px;
            border-radius: 999px;
            color: var(--paper);
            font: 700 .75rem/1.2 Arial, sans-serif;
            letter-spacing: .12em;
            text-transform: uppercase;
            background: var(--coral);
            transform: rotate(-2deg);
        }

        h1 {
            max-width: 680px;
            margin: 0;
            font-size: clamp(3.3rem, 9vw, 7rem);
            line-height: .9;
            letter-spacing: -.06em;
        }

        h1 span {
            display: block;
            color: var(--coral);
        }

        .intro {
            max-width: 570px;
            margin: 28px 0 42px;
            color: var(--muted);
            font: 1.08rem/1.6 Arial, sans-serif;
        }

        .downloads {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .download-card {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
            padding: 20px;
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: 16px;
            text-decoration: none;
            background: #fff;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .download-card:hover,
        .download-card:focus-visible {
            background: #fff8dc;
            transform: translateY(-5px) rotate(-1deg);
            box-shadow: 5px 5px 0 var(--ink);
            outline: none;
        }

        .file-icon {
            display: grid;
            flex: 0 0 52px;
            place-items: center;
            width: 52px;
            height: 58px;
            color: var(--paper);
            border-radius: 10px;
            font: 700 .7rem Arial, sans-serif;
            background: var(--coral);
        }

        .download-card:nth-child(2) .file-icon {
            background: var(--blue);
        }

        .file-name {
            min-width: 0;
            font: 700 1rem/1.3 Arial, sans-serif;
            overflow-wrap: anywhere;
        }

        .file-action {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font: .82rem Arial, sans-serif;
        }

        .status {
            min-height: 24px;
            margin: 22px 0 0;
            color: var(--coral);
            font: 700 .9rem Arial, sans-serif;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(18px, -20px) rotate(8deg); }
        }

        @media (max-width: 620px) {
            .content {
                box-shadow: 7px 7px 0 var(--ink);
            }

            .downloads {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="content" aria-labelledby="page-title">
            <p class="eyebrow">Your study corner</p>
            <h1 id="page-title">Hello <span>Students!</span></h1>
            <p class="intro">Everything you need for a focused study session, gathered in one cheerful little place.</p>

            <div class="downloads" aria-label="Download course files">
                <a class="download-card" href="notes.pptx" download>
                    <span class="file-icon" aria-hidden="true">PPTX</span>
                    <span>
                        <span class="file-name">Class notes</span>
                        <span class="file-action">Download presentation</span>
                    </span>
                </a>
                <a class="download-card" href="git_c.pdf" download>
                    <span class="file-icon" aria-hidden="true">PDF</span>
                    <span>
                        <span class="file-name">Git guide</span>
                        <span class="file-action">Download PDF notes</span>
                    </span>
                </a>
            </div>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script>
        const downloadLinks = document.querySelectorAll('.download-card');
        const status = document.querySelector('#status');

        downloadLinks.forEach((link) => {
            link.addEventListener('click', () => {
                const fileName = link.getAttribute('href');
                status.textContent = `Starting download: ${fileName}`;
            });
        });
    </script>
</body>
</html>
